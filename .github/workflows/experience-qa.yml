name: Experience and performance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: npm run lint && npm run typecheck && npm test && npm run check:docs
      - name: Guest browser, interaction matrix and Lighthouse
        run: npm run test:experience
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-evidence
          path: |
            .cache/experience-qa
            .cache/performance
          retention-days: 14
