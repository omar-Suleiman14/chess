name: Sync planning labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/sync-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and update labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const { owner, repo } = context.repo;
            for (const label of labels) {
              try {
                await github.rest.issues.updateLabel({
                  owner, repo, name: label.name,
                  new_name: label.name, color: label.color,
                  description: label.description,
                });
                core.info('Updated ' + label.name);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name: label.name,
                  color: label.color, description: label.description,
                });
                core.info('Created ' + label.name);
              }
            }
